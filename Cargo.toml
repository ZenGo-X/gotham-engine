[package]
name = "gotham-engine"
version = "1.2.0"

edition = "2021"

#[lib]
#name = "backbone"
#path = "src/lib.rs"

[features]
default = ["server_engine", "client_engine"]
server_engine = []
client_engine = []


[dependencies]
rusoto_core = { version = "0.47.0", optional = true }
rocksdb = { version = "0.21.0", optional = true }
rusoto_dynamodb = { version = "0.47.0", optional = true }
chrono = "0.4.26"
cargo-pants = "0.4.16"
redis = { version = "0.23.0", features = ["cluster"] }
thiserror = "1.0"
erased-serde = "0.3"
async-trait = "0.1.67"
tokio = { version = "1", features = ["full"] }
typetag = "0.2"
reqwest = { version =  "0.12.4", features = ["blocking", "json"] }
serde = { version = "1", features = ["serde_derive"] }
serde_json = "1"
log = "0.4"
failure = "0.1"
floating-duration = "0.1.2"
rocket = { version = "0.5.0-rc.1", default-features = false, features = ["json"] }
config = "0.14.0"
uuid = { version = "0.7", features = ["v4"] }
jsonwebtoken = "8"
hex = "0.4"
strum = "0.26"
strum_macros = "0.26"

two-party-ecdsa = { git = "https://github.com/ZenGo-X/two-party-ecdsa.git", branch="develop" }
two-party-musig2-eddsa = { git = "https://github.com/ZenGo-X/two-party-musig2-eddsa", branch = "feature/update-crates" }

#two-party-ecdsa = { path = "../two-party-ecdsa" }

